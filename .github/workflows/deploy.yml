name: Deploy to AWS App Runner (via ECR)

on:
  push:
    branches:
      - deploy

env:
  AWS_REGION: "ap-southeast-1"
  ECR_BACKEND_REPO: "lankalawbot-backend"
  ECR_FRONTEND_REPO: "lankalawbot-frontend"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest -f backend/Dockerfile backend/
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest

      - name: Fetch Frontend Environment Variables from AWS SSM
        run: |
          echo "BACKEND_URL=$(aws ssm get-parameter --name "/lankalawbot/BACKEND_URL" --with-decryption --query "Parameter.Value" --output text)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=$(aws ssm get-parameter --name "/lankalawbot/NEXT_PUBLIC_FIREBASE_API_KEY" --with-decryption --query "Parameter.Value" --output text)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$(aws ssm get-parameter --name "/lankalawbot/NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" --with-decryption --query "Parameter.Value" --output text)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$(aws ssm get-parameter --name "/lankalawbot/NEXT_PUBLIC_FIREBASE_PROJECT_ID" --with-decryption --query "Parameter.Value" --output text)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$(aws ssm get-parameter --name "/lankalawbot/NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" --with-decryption --query "Parameter.Value" --output text)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$(aws ssm get-parameter --name "/lankalawbot/NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" --with-decryption --query "Parameter.Value" --output text)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=$(aws ssm get-parameter --name "/lankalawbot/NEXT_PUBLIC_FIREBASE_APP_ID" --with-decryption --query "Parameter.Value" --output text)" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=$(aws ssm get-parameter --name "/lankalawbot/NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID" --with-decryption --query "Parameter.Value" --output text)" >> $GITHUB_ENV

      - name: Build, tag, and push frontend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=$BACKEND_URL \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=$NEXT_PUBLIC_FIREBASE_API_KEY \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=$NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=$NEXT_PUBLIC_FIREBASE_APP_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=$NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest -f frontend/Dockerfile frontend/
          
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest
