name: LankaLawBot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend lint, test, and image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install Dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Lint
        run: |
          ruff check --output-format=github \
            main.py \
            app/core/config.py \
            app/core/logging_config.py \
            app/auth/firebase_auth.py \
            app/database/postgres_session.py \
            app/services/ingestion/__init__.py \
            app/services/ingestion/document_storage.py \
            app/workers/document_ingestion_worker.py \
            tests/test_cloud_runtime.py \
            tests/test_firebase_auth.py
          ruff check --output-format=github alembic/env.py
          ruff format --check \
            main.py \
            app/core/config.py \
            app/core/logging_config.py \
            app/auth/firebase_auth.py \
            app/database/postgres_session.py \
            app/services/ingestion/__init__.py \
            app/services/ingestion/document_storage.py \
            app/workers/document_ingestion_worker.py \
            tests/test_cloud_runtime.py \
            tests/test_firebase_auth.py
          ruff format --check alembic/env.py

      - name: Test
        run: python -m pytest tests --quiet --tb=short

      - name: Validate Alembic graph
        run: alembic heads

      - name: Build container
        working-directory: .
        run: docker build --tag lankalawbot-backend:ci ./backend

  frontend:
    name: Frontend lint, test, and image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build container
        working-directory: .
        run: docker build --tag lankalawbot-frontend:ci ./frontend

  security:
    name: Dependency and filesystem security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
